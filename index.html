<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vehicle Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(15, 23, 42, 0.7);
            --text-dark: #e0f2fe;
            --text-light: #94a3b8;
            --neon-blue: #60a5fa;
            --neon-cyan: #22d3ee;
            --success: #2ecc71;
            --danger: #ff7675;
            --border-light: rgba(79, 172, 254, 0.3);
            --card-bg: rgba(30, 41, 59, 0.6);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex; justify-content: center; align-items: flex-start;
            padding: 20px; color: var(--text-dark);
        }

        .app-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%; max-width: 450px;
            padding: 25px; border-radius: 30px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(79, 172, 254, 0.15);
            margin-bottom: 30px;
        }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        .vehicle-select {
            background: rgba(79, 172, 254, 0.1);
            border: 1px solid var(--border-light);
            color: var(--neon-blue); padding: 8px 12px;
            border-radius: 10px; font-family: inherit;
            font-size: 0.9rem; outline: none; cursor: pointer;
        }

        .header h1 { font-size: 1.2rem; color: #fff; font-weight: 500; }
        .header p { font-size: 0.8rem; color: var(--text-light); text-align: right; }

        /* Total Spent Card */
        .total-card {
            background: linear-gradient(145deg, rgba(79, 172, 254, 0.1), rgba(34, 211, 238, 0.05));
            border: 1px solid var(--border-light);
            padding: 25px; border-radius: 20px;
            text-align: center; margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(79, 172, 254, 0.1);
        }

        .total-label { font-size: 0.9rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .total-amount { font-size: 2.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 15px rgba(79, 172, 254, 0.5); }
        .total-sub { font-size: 0.85rem; color: var(--success); margin-top: 5px; }

        /* Quick Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-box { background: var(--card-bg); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-title { font-size: 0.8rem; color: var(--text-light); margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .stat-value { font-size: 1.1rem; font-weight: 600; color: #fff; }

        /* List Header */
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .list-header h2 { font-size: 1.1rem; color: #fff; }
        .clear-btn { background: none; border: none; color: var(--danger); font-size: 0.85rem; cursor: pointer; }

        /* Expense List */
        .expense-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .expense-list::-webkit-scrollbar { width: 4px; }
        .expense-list::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

        .expense-item {
            background: var(--card-bg);
            padding: 15px; border-radius: 15px;
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.03);
            transition: transform 0.2s;
        }
        .expense-item:active { transform: scale(0.98); }

        .exp-info { display: flex; align-items: center; gap: 12px; }
        .exp-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        .exp-details h4 { font-size: 0.95rem; color: #fff; font-weight: 500; }
        .exp-details p { font-size: 0.75rem; color: var(--text-light); }
        
        .exp-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .exp-amount { font-size: 1rem; font-weight: 600; color: var(--neon-cyan); }
        .delete-btn { background: none; border: none; color: var(--danger); font-size: 0.8rem; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; }
        .delete-btn:hover { opacity: 1; }

        .empty-state { text-align: center; color: var(--text-light); padding: 40px 0; }
        .empty-state icon { font-size: 3rem; display: block; margin-bottom: 10px; }

        /* Add Button */
        .add-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px; background: var(--neon-blue);
            border: none; border-radius: 50%; color: #fff; font-size: 2rem;
            cursor: pointer; box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 10; transition: transform 0.2s;
        }
        .add-btn:active { transform: translateX(-50%) scale(0.9); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: flex-end;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .modal {
            background: #1e293b; width: 100%; max-width: 450px;
            padding: 25px; border-radius: 30px 30px 0 0;
            border-top: 1px solid var(--border-light);
            transform: translateY(100%); transition: transform 0.3s ease-out;
        }
        .modal-overlay.show .modal { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { color: #fff; font-size: 1.3rem; }
        .close-modal { background: none; border: none; color: var(--text-light); font-size: 1.5rem; cursor: pointer; }

        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.85rem; color: var(--text-light); margin-bottom: 8px; }
        
        .form-input, .form-select {
            width: 100%; padding: 12px 15px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: #fff; font-family: inherit; font-size: 1rem;
            outline: none; transition: border-color 0.2s;
        }
        .form-input:focus, .form-select:focus { border-color: var(--neon-blue); }
        .form-select option { background: #1e293b; }

        .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .cat-btn {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            padding: 10px 5px; background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            color: var(--text-light); cursor: pointer; transition: all 0.2s; font-size: 0.7rem;
        }
        .cat-btn span { font-size: 1.2rem; }
        .cat-btn.active { border-color: var(--neon-blue); color: var(--neon-blue); background: rgba(79, 172, 254, 0.1); }

        .submit-btn {
            width: 100%; padding: 15px; margin-top: 10px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-cyan));
            border: none; border-radius: 12px; color: #fff;
            font-size: 1.1rem; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>Vehicle Expenses</h1>
                <p id="current-month">Month</p>
            </div>
            <select id="vehicle-select" class="vehicle-select">
                <option value="Bike">🏍️ Bike</option>
                <option value="Car">🚗 Car</option>
                <option value="Truck">🚚 Truck</option>
            </select>
        </div>

        <!-- Total Spent -->
        <div class="total-card">
            <div class="total-label">Total Spent This Month</div>
            <div class="total-amount" id="total-amount">₹0</div>
            <div class="total-sub" id="total-sub">No expenses added yet</div>
        </div>

        <!-- Quick Stats -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-title">⛽ Fuel Cost</div>
                <div class="stat-value" id="stat-fuel">₹0</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">🔧 Maintenance</div>
                <div class="stat-value" id="stat-maint">₹0</div>
            </div>
        </div>

        <!-- List -->
        <div class="list-header">
            <h2>Recent Transactions</h2>
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>
        
        <div class="expense-list" id="expense-list">
            <div class="empty-state">
                <div style="font-size: 3rem; margin-bottom: 10px;">🧾</div>
                <p>No expenses added yet.<br>Click the + button to add one!</p>
            </div>
        </div>
    </div>

    <!-- Floating Add Button -->
    <button class="add-btn" onclick="openModal()">+</button>

    <!-- Add Expense Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Add Expense</h3>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>

            <div class="form-group">
                <label class="form-label">Select Category</label>
                <div class="cat-grid" id="cat-grid">
                    <!-- Generated by JS -->
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Amount (in ₹)</label>
                <input type="number" id="exp-amount" class="form-input" placeholder="e.g. 500" min="0">
            </div>

            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" id="exp-date" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Note (Optional)</label>
                <input type="text" id="exp-note" class="form-input" placeholder="e.g. Petrol pump near home">
            </div>

            <button class="submit-btn" onclick="saveExpense()">Save Expense</button>
        </div>
    </div>

    <script>
        // --- Data ---
        const categories = [
            { id: 'petrol', name: 'Petrol', icon: '⛽' },
            { id: 'diesel', name: 'Diesel', icon: '🛢️' },
            { id: 'service', name: 'Service', icon: '🔧' },
            { id: 'toll', name: 'Toll', icon: '🛣️' },
            { id: 'parking', name: 'Parking', icon: '🅿️' },
            { id: 'fine', name: 'Fine', icon: '🚨' },
            { id: 'insurance', name: 'Insurance', icon: '🛡️' },
            { id: 'other', name: 'Other', icon: '📦' }
        ];

        // --- Local Storage ---
        function getStorageItem(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function setStorageItem(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

        let expenses = JSON.parse(getStorageItem('vehicleExpenses')) || [];
        let currentVehicle = getStorageItem('currentVehicle') || 'Bike';
        let selectedCategory = 'petrol';

        // --- DOM ---
        const vehicleSelect = document.getElementById('vehicle-select');
        const currentMonth = document.getElementById('current-month');
        const totalAmount = document.getElementById('total-amount');
        const totalSub = document.getElementById('total-sub');
        const statFuel = document.getElementById('stat-fuel');
        const statMaint = document.getElementById('stat-maint');
        const expenseList = document.getElementById('expense-list');
        const modalOverlay = document.getElementById('modal-overlay');
        const catGrid = document.getElementById('cat-grid');

        // --- Init ---
        vehicleSelect.value = currentVehicle;
        document.getElementById('exp-date').valueAsDate = new Date();
        renderCategories();
        updateUI();

        // --- Render Category Buttons ---
        function renderCategories() {
            catGrid.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn' + (cat.id === selectedCategory ? ' active' : '');
                btn.innerHTML = `<span>${cat.icon}</span> ${cat.name}`;
                btn.onclick = () => {
                    selectedCategory = cat.id;
                    renderCategories();
                };
                catGrid.appendChild(btn);
            });
        }

        // --- UI Update ---
        function updateUI() {
            // Set Month
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const now = new Date();
            currentMonth.innerText = monthNames[now.getMonth()] + " " + now.getFullYear();

            // Filter by current vehicle and current month
            const filtered = expenses.filter(exp => 
                exp.vehicle === currentVehicle && 
                new Date(exp.date).getMonth() === now.getMonth() && 
                new Date(exp.date).getFullYear() === now.getFullYear()
            );

            // Calculate Totals
            let total = 0, fuel = 0, maint = 0;
            filtered.forEach(exp => {
                total += exp.amount;
                if(exp.category === 'petrol' || exp.category === 'diesel') fuel += exp.amount;
                if(exp.category === 'service' || exp.category === 'insurance') maint += exp.amount;
            });

            totalAmount.innerText = formatINR(total);
            totalSub.innerText = filtered.length > 0 ? `${filtered.length} transactions this month` : 'No expenses added yet';
            statFuel.innerText = formatINR(fuel);
            statMaint.innerText = formatINR(maint);

            // Render List
            if(filtered.length === 0) {
                expenseList.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 3rem; margin-bottom: 10px;">🧾</div>
                        <p>No expenses added yet.<br>Click the + button to add one!</p>
                    </div>
                `;
                return;
            }

            // Sort by date descending
            filtered.sort((a,b) => new Date(b.date) - new Date(a.date));

            expenseList.innerHTML = '';
            filtered.forEach(exp => {
                const cat = categories.find(c => c.id === exp.category);
                const item = document.createElement('div');
                item.className = 'expense-item';
                item.innerHTML = `
                    <div class="exp-info">
                        <div class="exp-icon">${cat.icon}</div>
                        <div class="exp-details">
                            <h4>${cat.name}</h4>
                            <p>${exp.note || new Date(exp.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}</p>
                        </div>
                    </div>
                    <div class="exp-right">
                        <div class="exp-amount">${formatINR(exp.amount)}</div>
                        <button class="delete-btn" onclick="deleteExpense(${exp.id})">Delete</button>
                    </div>
                `;
                expenseList.appendChild(item);
            });
        }

        // Format to Indian Rupees
        function formatINR(amount) {
            return '₹' + amount.toLocaleString('en-IN');
        }

        // --- Actions ---
        window.openModal = function() {
            modalOverlay.classList.add('show');
        }

        window.closeModal = function() {
            modalOverlay.classList.remove('show');
            document.getElementById('exp-amount').value = '';
            document.getElementById('exp-note').value = '';
            document.getElementById('exp-date').valueAsDate = new Date();
            selectedCategory = 'petrol';
            renderCategories();
        }

        window.saveExpense = function() {
            const amount = parseInt(document.getElementById('exp-amount').value);
            const date = document.getElementById('exp-date').value;
            const note = document.getElementById('exp-note').value;

            if(!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }
            if(!date) {
                alert('Please select a date');
                return;
            }

            expenses.push({
                id: Date.now(),
                vehicle: currentVehicle,
                category: selectedCategory,
                amount: amount,
                date: date,
                note: note
            });

            setStorageItem('vehicleExpenses', JSON.stringify(expenses));
            updateUI();
            closeModal();
        }

        window.deleteExpense = function(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            setStorageItem('vehicleExpenses', JSON.stringify(expenses));
            updateUI();
        }

        window.clearAll = function() {
            if(confirm('Are you sure you want to delete ALL expenses for ALL vehicles?')) {
                expenses = [];
                setStorageItem('vehicleExpenses', JSON.stringify(expenses));
                updateUI();
            }
        }

        // Vehicle change
        vehicleSelect.addEventListener('change', (e) => {
            currentVehicle = e.target.value;
            setStorageItem('currentVehicle', currentVehicle);
            updateUI();
        });
    </script>
</body>
</html>
